# Vídeos e capas protegidos: o PHP confere login/assinatura e responde com
# X-Accel-Redirect; o nginx entrega o arquivo (com Range, para avançar/voltar).
# "internal": não pode ser aberto direto pelo navegador.
# "^~": vence a regra de arquivos estáticos (.mp4, .png...) da imagem base.
location ^~ /_linkvideo_media/ {
    internal;
    alias /var/www/html/storage/app/private/;
    add_header X-Robots-Tag "noindex" always;
    add_header X-Content-Type-Options "nosniff" always;
}
